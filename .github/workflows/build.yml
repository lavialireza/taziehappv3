name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v5

      - name: نصب Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: ساخت APK (Debug)
        run: gradle assembleDebug

      - name: بارگذاری APK به‌عنوان خروجی قابل دانلود
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: انتشار APK در GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK Debug Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automatic debug APK build from commit ${GITHUB_SHA}." \
            --prerelease
